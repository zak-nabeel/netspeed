name: netspeed
description: "NetSpeed - A professional internet speed test app (Download, Upload, Ping) for Android and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Speed test engine (Fast.com based download/upload, maintained fork - AGP8+ compatible)
  flutter_internet_speed_test_pro: ^1.5.1

  # Ping / latency
  dart_ping: ^9.0.1
  dart_ping_ios: ^4.0.2

  # Network type / connectivity
  connectivity_plus: ^6.1.3

  # IP address / network details
  network_info_plus: ^6.1.3
  package_info_plus: ^8.1.3

  # Local storage for history
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts for history graph
  fl_chart: ^0.70.2

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  equatable: ^2.0.7

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true
